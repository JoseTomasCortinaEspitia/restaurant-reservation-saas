services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: restaurant_dev_2026
      POSTGRES_DB: restaurant_saas

    ports:
      - "5434:5432"

    volumes:
      - restaurant_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  restaurant_postgres_data:
